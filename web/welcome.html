<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to NOOOMIS</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 25%, #16213e 50%, #0f3460 75%, #533483 100%);
            background-size: 400% 400%;
            animation: gradientShift 12s ease infinite;
            overflow: hidden;
            position: relative;
            font-family: 'Press Start 2P', cursive;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #65C3FF, transparent),
                radial-gradient(2px 2px at 40px 70px, #FF6B6B, transparent),
                radial-gradient(1px 1px at 90px 40px, #4ECDC4, transparent),
                radial-gradient(1px 1px at 130px 80px, #FFE66D, transparent),
                radial-gradient(2px 2px at 160px 30px, #65C3FF, transparent);
            background-repeat: repeat;
            background-size: 200px 100px;
            animation: twinkle 4s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .nebula {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(101, 195, 255, 0.15) 0%, transparent 70%);
            animation: nebulaPulse 8s ease-in-out infinite;
        }

        @keyframes nebulaPulse {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        .welcome-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            max-width: 800px;
            width: 90%;
        }

        .logo-section {
            margin-bottom: 50px;
            position: relative;
        }

        .welcome-logo {
            width: 400px;
            height: auto;
            filter: drop-shadow(0 0 30px rgba(101, 195, 255, 0.8));
            animation: logoFloat 3s ease-in-out infinite;
            margin-bottom: 20px;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .logo-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(101, 195, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            animation: glowPulse 2s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.8; }
        }

        .welcome-title {
            font-size: 2.5rem;
            background: linear-gradient(45deg, #65C3FF, #FF6B6B, #4ECDC4, #FFE66D);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease-in-out infinite;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(101, 195, 255, 0.5);
        }

        .welcome-subtitle {
            font-size: 1rem;
            color: rgba(101, 195, 255, 0.8);
            margin-bottom: 40px;
            text-shadow: 0 0 10px rgba(101, 195, 255, 0.3);
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .welcome-button {
            padding: 20px 30px;
            background: linear-gradient(135deg, rgba(101, 195, 255, 0.2) 0%, rgba(255, 107, 107, 0.2) 100%);
            border: 2px solid rgba(101, 195, 255, 0.5);
            border-radius: 15px;
            color: #65C3FF;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(101, 195, 255, 0.3);
        }

        .welcome-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .welcome-button:hover::before {
            left: 100%;
        }

        .welcome-button:hover {
            transform: translateY(-5px) scale(1.05);
            border-color: #65C3FF;
            box-shadow: 0 15px 40px rgba(101, 195, 255, 0.5);
            background: linear-gradient(135deg, rgba(101, 195, 255, 0.3) 0%, rgba(255, 107, 107, 0.3) 100%);
        }

        .welcome-button:active {
            transform: translateY(-2px) scale(1.02);
        }

        .primary-button {
            background: linear-gradient(135deg, #65C3FF 0%, #4ECDC4 100%);
            color: #031225;
            border-color: #65C3FF;
            font-weight: bold;
        }

        .primary-button:hover {
            background: linear-gradient(135deg, #8cd2ff 0%, #6ee5dc 100%);
            box-shadow: 0 15px 40px rgba(101, 195, 255, 0.7);
        }

        .tutorial-indicator {
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.2) 0%, rgba(255, 230, 109, 0.2) 100%);
            border: 2px solid rgba(255, 107, 107, 0.5);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 30px;
            color: #FF6B6B;
            font-size: 0.8rem;
            animation: indicatorPulse 2s ease-in-out infinite;
        }

        @keyframes indicatorPulse {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        .version-info {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(101, 195, 255, 0.6);
            font-size: 0.8rem;
            text-shadow: 0 0 5px rgba(101, 195, 255, 0.3);
        }

        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: radial-gradient(circle, rgba(101, 195, 255, 0.6) 0%, transparent 70%);
            border-radius: 50%;
            animation: particleFloat 10s linear infinite;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) translateX(0) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) translateX(100px) scale(1);
                opacity: 0;
            }
        }

        .energy-waves {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .wave {
            position: absolute;
            width: 300px;
            height: 300px;
            border: 2px solid rgba(101, 195, 255, 0.2);
            border-radius: 50%;
            animation: waveExpand 6s ease-out infinite;
        }

        .wave:nth-child(1) { top: 10%; left: 5%; animation-delay: 0s; }
        .wave:nth-child(2) { top: 50%; right: 10%; animation-delay: 2s; }
        .wave:nth-child(3) { bottom: 10%; left: 15%; animation-delay: 4s; }

        @keyframes waveExpand {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        .first-time-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(26, 42, 74, 0.9) 0%, rgba(15, 52, 96, 0.9) 100%);
            border: 2px solid rgba(101, 195, 255, 0.5);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(101, 195, 255, 0.3);
        }

        .modal-content h2 {
            color: #65C3FF;
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-shadow: 0 0 10px rgba(101, 195, 255, 0.5);
        }

        .modal-content p {
            color: rgba(101, 195, 255, 0.8);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .modal-content button {
            margin: 10px;
            padding: 15px 25px;
            background: linear-gradient(135deg, #65C3FF 0%, #4ECDC4 100%);
            color: #031225;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8rem;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(101, 195, 255, 0.3);
        }

        .modal-content button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(101, 195, 255, 0.5);
        }

        .modal-content button.secondary {
            background: transparent;
            color: #65C3FF;
            border: 2px solid rgba(101, 195, 255, 0.5);
        }

        .modal-content button.secondary:hover {
            background: rgba(101, 195, 255, 0.1);
        }

        .quit-button {
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.2) 0%, rgba(255, 68, 68, 0.2) 100%) !important;
            border-color: rgba(255, 107, 107, 0.5) !important;
            color: #ff6b6b !important;
        }

        .quit-button:hover {
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.3) 0%, rgba(255, 68, 68, 0.3) 100%) !important;
            border-color: #ff6b6b !important;
            color: #ff4444 !important;
            box-shadow: 0 15px 40px rgba(255, 107, 107, 0.3) !important;
        }

        @media (max-width: 768px) {
            .welcome-logo {
                width: 300px;
            }
            
            .logo-glow {
                width: 350px;
                height: 350px;
            }
            
            .welcome-title {
                font-size: 2rem;
            }
            
            .button-grid {
                grid-template-columns: 1fr;
            }
            
            .welcome-button {
                padding: 15px 20px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="nebula"></div>
    
    <div class="particles" id="particles"></div>
    <div class="energy-waves">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
    </div>

    <div class="welcome-container">
        <div class="logo-section">
            <div class="logo-glow"></div>
            <img src="assets/nomis-logo.svg" alt="NOOOMIS Logo" class="welcome-logo">
        </div>
        
        <h1 class="welcome-title">Welcome to NOOOMIS</h1>
        <p class="welcome-subtitle">Digital, Dazzling, Delightfully Chaotic</p>
        
        <div id="tutorialIndicator" class="tutorial-indicator" style="display: none;">
            🎯 First Time? Complete Tutorial!
        </div>
        
        <div class="button-grid">
            <button class="welcome-button primary-button" onclick="startNewGame()">🎮 New Game</button>
            <button class="welcome-button" onclick="loadGame()">💾 Load Game</button>
            <button class="welcome-button" onclick="openTutorial()">📚 Tutorial</button>
            <button class="welcome-button" onclick="openLeaderboard()">🏆 Leaderboard</button>
            <button class="welcome-button quit-button" onclick="quitApp()">🚪 Quit App</button>
        </div>
    </div>

    <div class="version-info">Version 2.0 Enhanced • Meta Arc • New Game+</div>

    <div id="firstTimeModal" class="first-time-modal" style="display: none;">
        <div class="modal-content">
            <h2>Welcome, New Player!</h2>
            <p>It looks like this is your first time playing NOOOMIS. Would you like to go through a quick tutorial?</p>
            <button onclick="startTutorial()">Yes, show me the ropes!</button>
            <button class="secondary" onclick="skipTutorial()">No, I'm a pro.</button>
        </div>
    </div>

    <script>
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 25;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                // Random size
                const size = Math.random() * 3 + 1;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                
                // Random position
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                
                // Random animation delay
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.animationDuration = (Math.random() * 5 + 8) + 's';
                
                particlesContainer.appendChild(particle);
            }
        }

        // Check if this is first time user
        function checkFirstTime() {
            const hasPlayed = localStorage.getItem('nomis-has-played');
            const tutorialSkipped = localStorage.getItem('nomis-tutorial-skipped');
            const tutorialCompleted = localStorage.getItem('nomis-tutorial-completed');
            
            if (!hasPlayed) {
                document.getElementById('tutorialIndicator').style.display = 'block';
                document.getElementById('loadGameBtn').classList.add('disabled');
                document.getElementById('loadGameBtn').onclick = null;
            } else if (tutorialSkipped && !tutorialCompleted) {
                // User has played but skipped tutorial - show gentle reminder
                document.getElementById('tutorialIndicator').style.display = 'block';
                document.getElementById('tutorialIndicator').textContent = '💡 Consider taking the tutorial to learn advanced features!';
            }
        }

        // Navigation functions
        function startNewGame() {
            // Skip tutorial and go directly to game
            window.location.href = 'index.html';
        }

        function loadGame() {
            const hasPlayed = localStorage.getItem('nomis-has-played');
            if (hasPlayed) {
                window.location.href = 'index.html';
            } else {
                alert('No saved game found. Start a new game first!');
            }
        }

        function openTutorial() {
            window.location.href = 'tutorial.html';
        }

        function openLeaderboard() {
            window.location.href = 'leaderboard.html';
        }

        function startTutorial() {
            localStorage.setItem('nomis-first-time', 'false');
            window.location.href = 'tutorial.html';
        }

        function skipTutorial() {
            localStorage.setItem('nomis-first-time', 'false');
            window.location.href = 'index.html';
        }

        function quitApp() {
            if (confirm('Are you sure you want to quit NOOOMIS?')) {
                // Try different methods to close the app based on platform
                if (window.cordova) {
                    // Cordova/PhoneGap app
                    navigator.app.exitApp();
                } else if (window.navigator && window.navigator.app) {
                    // Android WebView
                    window.navigator.app.exitApp();
                } else if (window.close) {
                    // Browser window/tab
                    window.close();
                } else {
                    // Fallback - redirect to a blank page or show message
                    document.body.innerHTML = '<div style="display: flex; justify-content: center; align-items: center; height: 100vh; background: #031225; color: #65C3FF; font-family: \'Press Start 2P\', cursive; text-align: center;"><div><h1>Thanks for playing NOOOMIS!</h1><p>You can close this tab/window to exit.</p></div></div>';
                }
            }
        }

        // Menu functionality
        function toggleMenu() {
            const dropdown = document.getElementById('menuDropdown');
            dropdown.classList.toggle('show');
        }

        // Close menu when clicking outside
        document.addEventListener('click', function(event) {
            const menuButton = document.getElementById('menuButton');
            const menuDropdown = document.getElementById('menuDropdown');
            
            if (!menuButton.contains(event.target) && !menuDropdown.contains(event.target)) {
                menuDropdown.classList.remove('show');
            }
        });

        // Initialize welcome screen
        document.addEventListener('DOMContentLoaded', function() {
            createParticles();
            checkFirstTime();
            
            // Show first time modal if needed
            const isFirstTime = localStorage.getItem('nomis-first-time') === null;
            if (isFirstTime) {
                document.getElementById('firstTimeModal').style.display = 'flex';
            }
        });
    </script>
</body>
</html>
